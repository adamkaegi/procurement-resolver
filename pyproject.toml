[project]
name = "procurement-resolver"
version = "0.1.0"
description = "Cross-jurisdictional procurement resolver"
requires-python = ">=3.11,<3.12"
dependencies = [
    "duckdb==1.4.0",
    "fastmcp==2.12.3",
    "jsonschema==4.25.1",
    "openpyxl>=3.1.5",
    "pydantic==2.11.9",
    "pypdf==6.18.0",
    "pyyaml==6.0.3",
    "rapidfuzz==3.14.1",
]

[dependency-groups]
dev = [
    "pytest==8.4.2",
    "ruff==0.13.1",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
# NOT "src": src/*.py use package-relative imports (`from .validate import ...`),
# so they must be imported as `src.module`, which requires the repo root (not
# src/ itself) on sys.path. pythonpath = ["src"] was previously set here and
# would break on any test that imports a module using a relative import --
# never caught because no tests existed yet.
pythonpath = ["."]
