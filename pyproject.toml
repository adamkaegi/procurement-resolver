[project]
name = "procurement-resolver"
version = "0.1.0"
description = "Cross-jurisdictional procurement resolver"
requires-python = ">=3.11,<3.12"
dependencies = [
    "duckdb==1.4.0",
    "fastmcp==2.12.3",
    "jsonschema==4.25.1",
    "pydantic==2.11.9",
    "pyyaml==6.0.3",
    "rapidfuzz==3.14.1",
]

[dependency-groups]
dev = [
    "pytest==8.4.2",
    "ruff==0.13.1",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
pythonpath = ["src"]
