source_id: ottawa_historical_contracts
name: City of Ottawa contracts awarded under delegated authority (historical, 2020-2022)
url: https://open.ottawa.ca/search?q=contracts%20awarded%20under%20delegation%20of%20authority
document_host: https://ottawa.maps.arcgis.com/sharing/rest/content/items/
licence: City of Ottawa Open Data Licence v2.0 (based on the Open Government Licence - Canada)
licence_url: https://ottawa.ca/en/city-hall/get-know-your-city/open-data#open-data-licence-version-2-0
licence_verification: >-
  Verified 2026-09-15 directly against the ArcGIS Hub item metadata API
  (ottawa.maps.arcgis.com/sharing/rest/content/items/<id>?f=json) for each of
  the three ingested items -- all three report access="public" and a
  licenseInfo pointing at the same Open Data Licence v2.0 page already used
  for ottawa_contracts_awarded (item ids 6aacadb91ea7436982c8aa3a184fcf0c,
  bd1f2af6733a4404969d3c04f03c93a3, 70206a022fa2425e9626df86e499f1ac for the
  2020, 2021, and 2022 workbooks respectively). This is the same report
  series as ottawa_contracts_awarded, published as structured Excel workbooks
  for years before the City started publishing bi-annual ArcGIS Feature
  Services -- see docs/DECISIONS.md for why this is a separate source_id
  rather than a merge into the existing one.
jurisdiction: ottawa
value_threshold: 25000
record_cap: 5000
format: Microsoft Excel (.xlsx), two internal layouts by year (see src/ingest_ottawa_open_data.py)
notes: >-
  Structured spreadsheet cells, not OCR/regex-parsed PDF text -- extraction
  confidence is set higher than ottawa_contracts_awarded's PDF-parsed records
  for that reason (see extraction_conf in the code).
known_gaps:
  - "Only 2020, 2021, and 2022 are ingested. A combined 2016-2019 workbook exists on open.ottawa.ca (item 2a84a360272d4084a85dc576bc304176) but was excluded: it packs 8 quarterly sheets (2 departments x 4 half-years) with inconsistent headers ('Dept', 'Dept.', 'Department', 'Services' all appear as the same logical column) and no per-row date field at all, unlike 2020-2022. Deferred rather than force a fragile parser for it -- an honest scope cut, not an oversight."
  - "The 2020 workbook contains only 'FEDCO Q1-Q2' and 'TRANSIT Q1-Q2' sheets; no Jul-Dec 2020 half was found catalogued under this or a sibling title during a targeted search. Ottawa H2 2020 is therefore not covered by this warehouse at all (neither this source nor ottawa_contracts_awarded)."
  - "Chosen specifically to end at 2022-12-31 with zero date overlap against ottawa_contracts_awarded (whose earliest archived PDF report starts 2023-01-01) -- see docs/DECISIONS.md. Cross-source contract-ID reconciliation was not attempted or needed as a result."
  - "2021 and 2022 report only a period end date (from the report title, e.g. 'JANUARY 1, 2021 TO JUNE 30, 2021'), not a real per-contract award date -- both 'date' and the award date fall back to that period end, identical in spirit to ottawa_contracts_awarded's PDF-parsed records. 2020 does carry a real per-row 'PO Creation Date' and uses it directly."
  - "Vendor address (city/region) is dropped; only the vendor name is loaded as awards[].suppliers[].name."
