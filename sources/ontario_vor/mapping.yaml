source_id: ontario_vor
jurisdiction: "on"
encoding: cp1252
skip_rows: 2
required_source_field: Vendor of Record (VOR) Number
buyer_name: Ontario Government
mapping_version: phase-1-active-vor
mappings:
  - canonical: ocid
    source_field: Vendor of Record (VOR) Number
    transform: direct
  - canonical: id
    source_field: Vendor of Record (VOR) Number
    transform: direct
  - canonical: date
    source_field: Start Date
    transform: parse_date
  - canonical: buyer.name
    source_field: source_config
    transform: constant_ontario_government
  - canonical: awards[].suppliers[].name
    source_field: Qualified Vendor
    transform: direct
  - canonical: awards[].description
    source_field: Vendor of Record (VOR) Name
    transform: direct
  - canonical: awards[].value.amount
    disposition: unmapped
    transform: none
  - canonical: awards[].value.currency
    disposition: unmapped
    transform: none
  - canonical: contracts[].period.startDate
    source_field: Start Date
    transform: parse_date
  - canonical: contracts[].period.endDate
    source_field: End Date
    transform: parse_date