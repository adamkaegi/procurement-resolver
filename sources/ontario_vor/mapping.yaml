source_id: ontario_vor
jurisdiction: "on"
encoding: cp1252
skip_rows: 2
required_source_field: Vendor of Record (VOR) Number
classification_scheme: VOR
mapping_version: phase-1-active-vor
mappings:
  - canonical: ocid
    source_field: Vendor of Record (VOR) Number
    transform: direct
  - canonical: id
    source_field: Vendor of Record (VOR) Number
    transform: direct
  - canonical: date
    source_field: Start Date
    transform: parse_date
  - canonical: buyer.name
    transform: constant
    constant: Ontario Government
  - canonical: awards[].suppliers[].name
    source_field: Qualified Vendor
    transform: direct
  - canonical: awards[].description
    source_field: Vendor of Record (VOR) Name
    transform: direct
  # The source publishes no per-transaction value; zero is the documented
  # placeholder (see this source's coverage known_gaps), never inferred.
  - canonical: awards[].value.amount
    transform: constant
    constant: 0.0
  - canonical: awards[].value.currency
    transform: constant
    constant: CAD
  - canonical: awards[].items[].classification.id
    transform: constant
    constant: VOR
  - canonical: contracts[].period.startDate
    source_field: Start Date
    transform: parse_date
  - canonical: contracts[].period.endDate
    source_field: End Date
    transform: parse_date
